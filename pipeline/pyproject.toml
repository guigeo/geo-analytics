[project]
name = "geo-pipeline"
version = "0.1.0"
description = "ETL geoespacial: fontes IBGE/antenas -> GeoParquet canonico -> PMTiles"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.0",
    # Piso explicito: a imagem base do GDAL roda Python 3.14, e shapely so publica
    # wheel para cp314 a partir da 2.1.2. Sem ele o uv resolve 2.1.0, que compila
    # do fonte — e o Dockerfile expurga o build-essential, entao o build da imagem
    # falha com "aarch64-linux-gnu-gcc: No such file or directory".
    "shapely>=2.1.2",
    "pyarrow>=16",
    "pyyaml>=6",
    "pydantic>=2",
    "psycopg[binary]>=3.2",
]

[project.scripts]
geo-pipeline = "geo_pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geo_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
