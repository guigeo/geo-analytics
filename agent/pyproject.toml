[project]
name = "geo-agent"
version = "0.1.0"
description = "Agente de IA do chat (OpenAI function calling) sobre a camada de consulta geo-query"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "openai>=1.60",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "geo-query",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv.sources]
geo-query = { path = "../query", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geo_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Benchmark (chama a OpenAI real, requer OPENAI_API_KEY) fica fora do run padrao:
#   uv run pytest -m benchmark
addopts = "-m 'not benchmark'"
markers = ["benchmark: casos do benchmark.yaml contra a OpenAI real (custo/chave)"]
