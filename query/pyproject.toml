[project]
name = "geo-query"
version = "0.1.0"
description = "Camada de consulta (DuckDB) sobre o GeoParquet canonico - backend de dados da Fase 2"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geo_query"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
