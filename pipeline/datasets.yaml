# Registry declarativo dos datasets (paths relativos a raiz do repo).
# Adicionar um dataset novo = adicionar uma entrada aqui (Fase 3, sem refactor).

output:
  processed_dir: data/processed
  # tiles_dir nao mora aqui: os .pmtiles vao para o host de tiles compartilhado,
  # que e configuracao de ambiente (GEO_TILES_DIR). Ver ../webgis/docs/LOCAL.md.

datasets:
  - name: uf
    source:
      kind: geodata
      # Apelidos entre aspas: o tile publica CD_UF/NM_UF/SIGLA_UF, que e o que o
      # frontend le. Trocar a fonte nao pode mudar o contrato do mapa.
      sql: >-
        select cod_uf as "CD_UF", nome as "NM_UF", sigla_uf as "SIGLA_UF", geom
        from ibge.uf
    geometry: polygon
    attributes: [CD_UF, NM_UF, SIGLA_UF]
    tile: { minzoom: 0, maxzoom: 8 }

  - name: municipio
    source:
      kind: geodata
      # As 2 areas operacionais entram no UNION de proposito. O banco as separou de
      # ibge.municipio para que join por codigo nunca devolva uma lagoa — mas no MAPA
      # elas precisam existir: sao 13.000 km2 de agua no RS (Lagoa dos Patos e Lagoa
      # Mirim) e, sem elas, o sul do Brasil fica com dois buracos. Separadas no dado,
      # desenhadas no tile. Total: 5.571 + 2 = 5.573, igual ao tile atual.
      sql: >-
        select cod_municipio as "CD_MUN", nome as "NM_MUN", sigla_uf as "SIGLA_UF",
               nome_uf as "NM_UF", geom
        from ibge.municipio
        union all
        select a.codigo, a.nome, a.sigla_uf, u.nome, a.geom
        from ibge.area_operacional a join ibge.uf u using (sigla_uf)
    geometry: polygon
    attributes: [CD_MUN, NM_MUN, SIGLA_UF, NM_UF]
    tile: { minzoom: 0, maxzoom: 10 }

  - name: distrito
    source:
      kind: geodata
      # Nome de municipio e de UF vem do join, como no bairro. O tile publica CD_DIST/
      # NM_DIST porque e assim que o IBGE nomeia na malha de distritos (cd_dist/nm_dist)
      # — o mesmo criterio que deu CD_BAIRRO ao bairro.
      #
      # As 2 areas operacionais do RS nao aparecem aqui: a carga do geodata ja as
      # descartou desta malha (elas vem sem cd_mun) e elas ja sao desenhadas pela
      # camada de municipio.
      sql: >-
        select d.cod_distrito as "CD_DIST", d.nome as "NM_DIST",
               d.cod_municipio as "CD_MUN", m.nome as "NM_MUN", m.nome_uf as "NM_UF",
               d.geom
        from ibge.distrito d join ibge.municipio m using (cod_municipio)
    geometry: polygon
    attributes: [CD_DIST, NM_DIST, CD_MUN, NM_MUN, NM_UF]
    # Sem simplification, como o municipio — e a decisao custa 42 MB de proposito.
    # Medido em 2026-08-22: 96,1 MB assim, 54,1 MB com simplification=10. O contorno
    # externo dos distritos de um municipio E o contorno do municipio, e simplificar
    # so um dos dois separa em tela duas linhas que sao a mesma linha. Os 42 MB saem
    # de um tile compartilhado por todos os clientes (passo 1 do roteiro), ao lado de
    # 591 MB de setor — nao e onde o disco da VPS se decide.
    tile: { minzoom: 4, maxzoom: 12 }

  - name: bairro
    source:
      kind: geodata
      # Nome de municipio e de UF nao vivem em ibge.bairro: vem do join. O tile publica
      # os dois porque o popup do mapa os mostra.
      sql: >-
        select b.cod_bairro as "CD_BAIRRO", b.nome as "NM_BAIRRO",
               m.nome as "NM_MUN", m.nome_uf as "NM_UF", b.geom
        from ibge.bairro b join ibge.municipio m using (cod_municipio)
    geometry: polygon
    attributes: [CD_BAIRRO, NM_BAIRRO, NM_MUN, NM_UF]
    tile: { minzoom: 5, maxzoom: 13 }

  - name: setor
    source:
      kind: geodata
      # Ao contrario de municipio, aqui as 2 lagoas do RS NAO entram. La elas sao
      # area operacional com nome proprio e o municipio e a camada que desenha o
      # contorno do pais; aqui sao preenchimento de malha — codigo terminado em
      # zeros (430000100000000) e CD_MUN, NM_MUN e SITUACAO todos nulos. O tile
      # atual as pinta como setor de popup vazio. 468.097 em vez de 468.099.
      sql: >-
        select s.cod_setor as "CD_SETOR", s.cod_municipio as "CD_MUN",
               m.nome as "NM_MUN", s.situacao as "SITUACAO", s.geom
        from ibge.setor_censitario s join ibge.municipio m using (cod_municipio)
    geometry: polygon
    attributes: [CD_SETOR, CD_MUN, NM_MUN, SITUACAO]
    tile: { minzoom: 6, maxzoom: 14, simplification: 10 }   # camada critica (~468k)

  - name: antenas
    source:
      kind: geodata
      # Apelidos SEM aspas aqui: o contrato desta camada e minusculo (veio de CSV,
      # nao do IBGE), e sem aspas o Postgres ja minusculiza. tecnologias e
      # frequencias_mhz sao arrays no banco e string juntada por " - " no tile —
      # array_to_string reproduz exatamente o que o front ja le.
      # uf e municipio deixam de ser texto carregado do CSV do Teleco e passam a ser
      # o nome oficial do IBGE resolvido por codigo: "Capao da Canoa" vira "Capão da
      # Canoa".
      sql: >-
        select a.operadora, m.sigla_uf as uf, m.nome as municipio,
               array_to_string(a.tecnologias, ' - ') as tecnologia,
               array_to_string(a.frequencias_mhz, ' - ') as frequencia,
               a.geom
        from infraestrutura.antena a join ibge.municipio m using (cod_municipio)
    geometry: point
    attributes: [operadora, uf, municipio, tecnologia, frequencia]
    tile: { minzoom: 4, maxzoom: 14 }



  - name: rodovias
    source:
      kind: geodata
      sql: >-
        select sigla, tipo_via as tipovia, jurisdicao, revestimento, geom
        from infraestrutura.rodovia
    geometry: line
    attributes: [sigla, tipovia, jurisdicao, revestimento]
    tile: { minzoom: 4, maxzoom: 13 }

  - name: ferrovias
    source:
      kind: geodata
      sql: >-
        select nome, bitola, jurisdicao, situacao_fisica as situacaofisica, geom
        from infraestrutura.ferrovia
    geometry: line
    attributes: [nome, bitola, jurisdicao, situacaofisica]
    tile: { minzoom: 5, maxzoom: 13 }

basemap:
  provider: protomaps
  bbox: [-74.0, -34.0, -34.0, 6.0]   # lon_min, lat_min, lon_max, lat_max (Brasil)
  maxzoom: 13                         # ruas no zoom proximo; zoom-out continua simples (vector tiles por-zoom)
  out: basemap.pmtiles
