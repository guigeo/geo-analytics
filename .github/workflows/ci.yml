# CI do geo-analytics — portado do `webgis-core`, que o inventário de herança marca
# como "copiar" (../../webgis/docs/HERANCA.md, §1). Duas adaptações: o frontend
# mora em `web/` e não em `frontend/`, e o backend aqui são três módulos Python
# independentes, cada um com seu pyproject.
#
# Este arquivo é a rede de segurança do passo 5 do ADR-0001: parametrizar a casca
# mexe no código que desenha o mapa de uma aplicação que está em produção, e até
# 2026-08-29 não havia teste nenhum de frontend para dizer se ela continuou
# inteira.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      # Node 20 de propósito: é a imagem em que o build de produção roda
      # (`node:20-slim`, no docker-compose.yml, chamado por deploy/deploy.sh).
      # CI numa versão mais nova passaria enquanto o build real quebra.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Formatação
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build de produção
        run: npm run build

  python:
    name: Python (${{ matrix.modulo }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        modulo: [agent, pipeline, query]
    defaults:
      run:
        working-directory: ${{ matrix.modulo }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Lint
        run: uv run ruff check .

      # Sem GEODATA_DSN aqui, e é deliberado: os testes que tocam o geodata se
      # pulam sozinhos com a instrução, e o que sobra — o que roda offline — é
      # justamente o que um CI sem banco central consegue garantir. Subir um
      # PostGIS vazio no runner não ajudaria: as consultas são contra dado real.
      - name: Testes
        run: uv run pytest -q
