# Servicos:
#   pipeline -> ETL geoespacial (gera GeoParquet + PMTiles)
#   web      -> dev server do mapa (Vite, HMR) em http://localhost:5173
#   preview  -> build de producao servido por Caddy (IGUAL a VPS) em :8080
#
# Fluxo: desenvolve (web) -> valida (preview) -> manda (deploy/deploy.sh). Ver Makefile.
#
# Uso:
#   docker compose build                          # constroi a imagem do ETL
#   docker compose run --rm pipeline build        # gera tiles + basemap
#   docker compose up web                          # dev em :5173
#   docker compose --profile preview up preview   # preview de producao em :8080
services:
  pipeline:
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    volumes:
      - .:/repo
      - ${TILES_DIR:?defina TILES_DIR no .env (ver ../webgis/docs/LOCAL.md)}:/tiles
    working_dir: /repo/pipeline
    environment:
      # Sobrescreva para um build mais recente: https://maps.protomaps.com/builds/
      - PROTOMAPS_BUILD_URL=${PROTOMAPS_BUILD_URL:-}
      # Os tiles saem do repositório: o pipeline escreve direto no diretório do
      # host de tiles compartilhado, montado abaixo.
      - GEO_TILES_DIR=/tiles
      # Dado universal vem do geodata central, não de data/ (passo 4 do roteiro).
      # Dentro do container o banco NÃO é localhost: use host.docker.internal.
      - GEODATA_DSN=${GEODATA_DSN:-}
    # host-gateway faz host.docker.internal existir também no Linux, onde ele não
    # vem de graça como no Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    image: node:20-slim
    working_dir: /repo/web
    command: sh -c "npm install && npm run dev -- --host --port $${PORTA_WEB:-5173}"
    environment:
      # Qual cliente este dev server serve. Resolvido no build pelo vite.config.ts;
      # sem a variável, o geo-analytics, que é o comportamento de sempre.
      - VITE_CLIENTE=${VITE_CLIENTE:-geo-analytics}
      # A porta precisa entrar no container também: o `--port` do Vite roda lá
      # dentro, e a publicação aqui embaixo tem de casar com ela.
      - PORTA_WEB=${PORTA_WEB:-5173}
      # A quem o proxy /api entrega: cada cliente tem o seu agente, em porta
      # própria (make agente CLIENTE=… PORTA_IA=…).
      - PORTA_AGENTE=${PORTA_AGENTE:-8000}
    ports:
      - "${PORTA_WEB:-5173}:${PORTA_WEB:-5173}"
    volumes:
      - .:/repo
      - web_node_modules:/repo/web/node_modules

  # Preview de producao: serve web/dist + tiles com o MESMO Caddy/config da VPS.
  # Exige um build antes (web/dist). Espelha o layout /var/www/geo da VPS.
  #
  # Os tiles vêm do host compartilhado (TILES_DIR), nao mais de web/public/tiles.
  # Para exercitar o caminho de produção da VPS — app e tiles no mesmo domínio —
  # rode o preview SEM VITE_TILES_BASE_URL no build.
  preview:
    image: caddy:2-alpine
    profiles: ["preview"]
    ports:
      - "8080:80"
    environment:
      # O preview passou a fazer proxy de /api, como a VPS faz: sem isto ele
      # serviria o app sem o chat, que é metade do caminho de produção.
      - PORTA_AGENTE=${PORTA_AGENTE:-8000}
    # O agente roda NATIVO no host; de dentro do container ele não é localhost.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./web/dist:/srv/app:ro
      - ${TILES_DIR:?defina TILES_DIR no .env (ver ../webgis/docs/LOCAL.md)}:/srv/tiles:ro
      - ./deploy/Caddyfile.local:/etc/caddy/Caddyfile:ro

volumes:
  web_node_modules:
